name: Vérifications pédagogiques et techniques
on:
  push:
    branches:
      - defis-conjugaison-v4
      - defis-orthographe-maths-v5
      - personnalisation-v6
      - release-candidate-v7
      - audit-maths-coaching-v8
      - parcours-maths-v9
      - conjugaison-saisie-v10
      - lecture-plaisir-v11
      - francais-parcours-v12
  pull_request:
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check learning-engine.js
          node --check conjugation-engine.js
          node --check practice-bank.js
          node --check practice-engine.js
          node --check personalization-engine.js
          node --check math-coach.js
          node --check math-journey.js
          node --check french-paths.js
          node --check dictation-engine.js
          node --check orthography-data.js
          node --check readings.js
      - name: Vérifier les règles pédagogiques
        run: node tests/verify.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium pour les tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Parcours navigateur mobile et ordinateur
        run: node tests/browser.js
